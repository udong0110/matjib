<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('BUSEAT - 로그인')}"></head>
<body>
<nav th:replace="~{fragments/layout :: mainNav}"></nav>

<div class="form-wrap">
    <h2>로그인</h2>
    <p class="sub">BUSEAT에 오신 걸 환영해요.</p>

    <div th:if="${param.error}" class="alert alert-error">아이디 또는 비밀번호가 올바르지 않습니다.</div>
    <div th:if="${param.logout}" class="alert alert-success">로그아웃되었습니다.</div>
    <div th:if="${param.joined}" class="alert alert-success">회원가입이 완료되었어요. 로그인해 주세요.</div>

    <form th:action="@{/login}" method="post">
        <div class="field">
            <label>아이디</label>
            <input type="text" name="username" placeholder="아이디" required autofocus/>
        </div>
        <div class="field">
            <label>비밀번호</label>
            <input type="password" name="password" placeholder="비밀번호" required/>
        </div>
        <button type="submit" class="btn-primary">로그인</button>
    </form>
    <div class="form-foot">
        아직 회원이 아니신가요? <a th:href="@{/signup}">회원가입</a>
    </div>
</div>
</body>
</html>
