<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title}">BUSEAT</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<!-- ===== 일반 헤더 (로그인/마이페이지) ===== -->
<nav class="nav" th:fragment="mainNav">
    <div class="right">
        <a th:href="@{/}">홈</a>
        <a sec:authorize="!isAuthenticated()" th:href="@{/login}">로그인</a>
        <a sec:authorize="!isAuthenticated()" th:href="@{/signup}"><button class="btn-login">회원가입</button></a>
        <a sec:authorize="isAuthenticated()" th:href="@{/mypage}">마이페이지</a>
        <form sec:authorize="isAuthenticated()" th:action="@{/logout}" method="post" style="display:inline">
            <button type="submit" style="background:none;border:none;cursor:pointer;font:inherit;font-weight:600;color:var(--gray)">로그아웃</button>
        </form>
    </div>
</nav>

<!-- ===== 홈 전용 헤더 (로고 없이 로그인/회원가입만) ===== -->
<nav class="nav nav-simple" th:fragment="navSimple">
    <div class="right">
        <a sec:authorize="!isAuthenticated()" th:href="@{/login}">로그인</a>
        <a sec:authorize="!isAuthenticated()" th:href="@{/signup}" class="link-signup">회원가입</a>
        <a sec:authorize="isAuthenticated()" th:href="@{/mypage}">마이페이지</a>
        <form sec:authorize="isAuthenticated()" th:action="@{/logout}" method="post" style="display:inline">
            <button type="submit" class="link-logout">로그아웃</button>
        </form>
    </div>
</nav>

</body>
</html>
